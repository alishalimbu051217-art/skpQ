<body class="text-on-surface selection:bg-primary-container selection:text-on-primary-container">

<div class="absolute -bottom-24 -left-24 w-64 h-64 bg-secondary-fixed opacity-20 rounded-full blur-3xl pointer-events-none"></div>

                </span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">SkpQ</h1>

<!-- Role Selection Canvas -->

<!-- Customer Card -->

                        person
                    </span>
</div>
<div class="flex flex-col">
<span class="font-title-md text-title-md text-on-surface">Customer</span>
<span class="font-body-md text-body-md text-on-surface-variant">Scan &amp; shop on the go</span>
</div>
<span class="material-symbols-outlined ml-auto text-outline group-hover:text-primary transition-colors">
                    chevron_right
                </span>
<!-- Decorative element -->
<div class="absolute -bottom-4 -right-4 w-12 h-12 bg-primary/5 rounded-full group-hover:scale-[3] transition-transform duration-500"></div>
</button>

<span class="material-symbols-outlined text-[32px]">
                        badge
                    </span>
</div>
<div class="flex flex-col">
<span class="font-title-md text-title-md text-on-surface">Employee</span>
<span class="font-body-md text-body-md text-on-surface-variant">Inventory &amp; staff portal</span>
</div>
<span class="material-symbols-outlined ml-auto text-outline group-hover:text-primary transition-colors">
                    chevron_right
                </span>
<!-- Decorative element -->
<div class="absolute -bottom-4 -right-4 w-12 h-12 bg-secondary/5 rounded-full group-hover:scale-[3] transition-transform duration-500"></div>
</button>
</div>
<!-- Footer Info -->

<p class="font-label-sm text-label-sm text-on-surface-variant opacity-60">Version 2.4.0 • Enterprise Edition</p>
</footer>
</main>
<!-- Role Selection Interaction Script -->
<script>
        function selectRole(role) {
            console.log("Selected role:", role);
            
            // Visual feedback
            const cards = document.querySelectorAll('.role-card');
            cards.forEach(card => {
                if(card.innerText.toLowerCase().includes(role)) {
                    card.classList.add('ring-2', 'ring-primary', 'bg-primary-container/10');
                }
            });

            // Route to the correct login flow
            setTimeout(() => {
                window.location.href = role === 'customer' ? 'login.html' : 'employee-login.html';
            }, 250);
        }

        // Add subtle hover tracking effect for cards
        document.querySelectorAll('.role-card').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            });
        });
    </script>
<script>
    // If someone's already signed in (customer or employee), skip role
    // selection + login entirely and take them straight to their home page.
    auth.onAuthStateChanged(user => {
        if (!user) return; // not signed in — show role selection normally
        if (localStorage.getItem('skpq_role') === 'employee') {
            window.location.href = 'employee-home.html';
        } else {
            window.location.href = 'dashboard.html';
        }
    });
</script>
<!-- Custom Cursor / Interaction CSS -->
<style>
        .role-card {
            position: relative;
        }
        .role-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle 80px at var(--mouse-x, 0) var(--mouse-y, 0), rgba(0, 104, 95, 0.05), transparent);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .role-card:hover::before {
            opacity: 1;
        }
    </style>
