            100% { box-shadow: 0 0 0 0 rgba(13, 148, 136, 0); }

</button>
<div>

</div>
</div>

<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary-fixed transition-all duration-200 active:scale-90" href="profile.html">
<span class="material-symbols-outlined">person</span>

<script>
        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.innerText = 'dark_mode';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                icon.innerText = 'light_mode';
                localStorage.setItem('theme', 'dark');
            }
        }

        // Initialize theme based on preference
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-icon').innerText = 'light_mode';
        } else {
            document.documentElement.classList.remove('dark');
            document.getElementById('theme-icon').innerText = 'dark_mode';
        }

        // Simple haptic-like interaction for buttons
        document.querySelectorAll('button, a').forEach(btn => {
            btn.addEventListener('click', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            });
        });
    </script>
<script>
    auth.onAuthStateChanged(user => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        const firstName = (user.displayName || 'there').split(' ')[0];
        document.getElementById('welcome-name').textContent = firstName;

        db.collection('users').doc(user.uid).get().then(doc => {
            const photoURL = doc.exists ? doc.data().photoURL : null;
            const img = document.getElementById('header-avatar-img');
            const fallback = document.getElementById('header-avatar-fallback');
            if (photoURL) {
                img.src = photoURL;
                img.classList.remove('hidden');
                fallback.classList.add('hidden');
            }
        }).catch(() => {});

        loadVisitAndLoyalty(user.uid);
    });

    // ---------------------------------------------------------
    // Last Visit — shows the previous visit's timestamp (stored in
    // Firestore), then updates it to "now" for next time.
    // ---------------------------------------------------------
    function formatVisit(date) {
        const now = new Date();
        const isToday = date.toDateString() === now.toDateString();
        const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
        const isYesterday = date.toDateString() === yesterday.toDateString();
        const time = date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
        if (isToday) return `Today, ${time}`;
        if (isYesterday) return `Yesterday, ${time}`;
        return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + `, ${time}`;
    }

    async function loadVisitAndLoyalty(uid) {
        const userRef = db.collection('users').doc(uid);

        // Last visit: read the previously stored value, then overwrite it with now
        try {
            const doc = await userRef.get();
            const prevVisit = doc.exists && doc.data().lastVisit ? doc.data().lastVisit.toDate() : null;
            document.getElementById('last-visit-value').textContent = prevVisit ? formatVisit(prevVisit) : 'First visit!';
            await userRef.set({ lastVisit: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        } catch (err) {
            console.error('Could not load/update last visit:', err);
        }

        // Total spent + loyalty points/tier: computed live from paid orders
        try {
            const snap = await db.collection('sessions')
                .where('customerUid', '==', uid)
                .where('status', '==', 'paid')
                .get();

            let totalSpent = 0;
            snap.forEach(doc => { totalSpent += doc.data().total || 0; });

            document.getElementById('total-spent-value').textContent = `₹${totalSpent.toFixed(2)}`;

            // 1 point per ₹10 spent; simple tier thresholds
            const points = Math.floor(totalSpent / 10);
            let tier = 'Bronze Tier';
            if (totalSpent >= 5000) tier = 'Gold Tier';
            else if (totalSpent >= 1500) tier = 'Silver Tier';

            document.getElementById('loyalty-points').textContent = points.toLocaleString();
            document.getElementById('loyalty-tier').textContent = tier;
        } catch (err) {
            console.error('Could not compute loyalty stats:', err);
        }
    }

    const dashItems = Cart.get();
    const dashQty = dashItems.reduce((s, i) => s + i.qty, 0);
    document.getElementById('dash-cart-badge').textContent = `${dashQty} Item${dashQty === 1 ? '' : 's'}`;
    document.getElementById('dash-cart-total').textContent = `₹${Cart.total().toFixed(2)}`;
</script>
