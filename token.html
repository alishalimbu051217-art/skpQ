<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D9488">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SkpQ">
<script src="js/pwa.js" defer></script>
<link rel="stylesheet" href="css/tailwind.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .animate-pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .qr-gradient {
            background: linear-gradient(135deg, #00685f 0%, #0D9488 100%);
        }
    </style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="js/cart.js"></script>
</head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-gutter w-full h-16 sticky top-0 z-50 bg-surface border-b border-outline-variant">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-primary-container transition-colors active:opacity-80 scale-95 duration-100" onclick="window.location.href='cart.html'">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-black tracking-tight">SkpQ</h1>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-container-padding py-xl">
<!-- Main Token Card -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-[24px] shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border border-outline-variant overflow-hidden flex flex-col items-center p-xl relative">
<!-- Atmospheric Backdrop (Subtle) -->
<div class="absolute top-0 left-0 w-full h-2 bg-primary"></div>
<div class="text-center mb-lg">
<h2 class="font-title-md text-title-md text-on-surface mb-xs">Verification Token</h2>
<p class="font-body-md text-on-surface-variant max-w-[240px] mx-auto">Show this to the employee for verification</p>
</div>
<!-- QR Code Container -->
<div class="relative group">
<!-- Decorative animated ring -->
<div class="absolute -inset-4 rounded-[32px] border-2 border-primary/20 animate-pulse-ring"></div>
<div class="bg-white p-6 rounded-[24px] shadow-sm border border-outline-variant w-64 h-64 md:w-72 md:h-72 flex items-center justify-center" id="qr-code-container"></div>
<!-- Scanning Brackets -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-primary rounded-tl-lg"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-primary rounded-tr-lg"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-primary rounded-bl-lg"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-primary rounded-br-lg"></div>
</div>
<!-- Token Number -->
<div class="mt-xl text-center">
<span class="text-label-sm font-label-sm text-on-surface-variant tracking-widest uppercase">Token Number</span>
<div class="text-[40px] font-black tracking-widest text-primary mt-xs" id="token-number">------</div>
</div>
<!-- Status Indicator -->
<div class="mt-lg w-full flex items-center justify-center gap-3 py-4 px-6 bg-secondary-container/30 rounded-xl border border-secondary-fixed">
<div class="relative flex h-3 w-3">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-secondary opacity-75"></span>
<span class="relative inline-flex rounded-full h-3 w-3 bg-secondary"></span>
</div>
<p class="font-label-md text-on-secondary-container" id="status-text">Waiting for employee verification...</p>
</div>
</div>
<!-- Help/Manual Entry Section -->
<div class="mt-xl w-full max-w-md flex flex-col gap-4">
<button class="w-full py-4 px-6 border-2 border-outline rounded-xl font-label-md text-on-surface hover:bg-surface-variant transition-all active:scale-95 duration-100 flex items-center justify-center gap-2">
<span class="material-symbols-outlined">edit_note</span>
                Manual Entry
            </button>
<p class="text-center font-label-sm text-on-surface-variant">
                Difficulty scanning? Ask the associate to enter the token number manually.
            </p>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-surface-container shadow-[0px_-4px_20px_rgba(0,0,0,0.05)] rounded-t-xl">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary text-on-primary rounded-xl px-4 py-1 transition-transform duration-200 active:scale-90" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">barcode_scanner</span>
<span class="font-label-sm text-label-sm">Scan</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</a>
</nav>
<script>
    auth.onAuthStateChanged(user => {
        if (!user) window.location.href = 'login.html';
    });

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
        // No token in the URL — nothing to show, go back to the cart
        window.location.href = 'cart.html';
    } else {
        document.getElementById('token-number').textContent = token;

        // Render the QR code (encodes the token so the employee can scan OR type it manually)
        new QRCode(document.getElementById('qr-code-container'), {
            text: token,
            width: 220,
            height: 220,
            colorDark: "#00685f",
            colorLight: "#ffffff"
        });

        // Real-time listener: redirect to the success screen the moment
        // the employee marks this session as verified
        db.collection('sessions').doc(token).onSnapshot(doc => {
            if (!doc.exists) return;
            const data = doc.data();
            if (data.status === 'verified') {
                window.location.href = `verified.html?token=${token}`;
            } else if (data.status === 'rejected') {
                document.getElementById('status-text').textContent =
                    'Verification failed — please see an associate.';
            }
        });
    }
</script>
</body></html>
