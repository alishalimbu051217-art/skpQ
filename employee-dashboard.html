<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<title>SkpQ Employee Portal</title>
<link rel="stylesheet" href="css/tailwind.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    body { font-family: 'Inter', sans-serif; }
    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        display: inline-block; line-height: 1; text-transform: none; letter-spacing: normal;
        word-wrap: normal; white-space: nowrap; direction: ltr;
    }

    /* Leave room for the fixed bottom menu so nothing is cut off */
    .page { width: 100%; max-width: 440px; margin: 0 auto;
            padding: 20px 20px calc(110px + env(safe-area-inset-bottom, 0px)); }
    .intro { text-align: center; margin-bottom: 20px; }
    .intro h2 { font-size: 26px; font-weight: 800; margin: 0; }
    .intro p { font-size: 15px; color: #5b6665; margin: 8px 0 0; line-height: 1.45; }

    /* Viewfinder: one square, one frame */
    .finder { position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 28px;
              overflow: hidden; background: #0f1716; box-shadow: 0 10px 30px rgba(0,0,0,.15); }
    #qr-reader { position: absolute; inset: 0; border: 0 !important; }
    #qr-reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
    /* hide the library's own white corner marks, we draw our own */
    #qr-shaded-region { display: none !important; }
    #qr-reader img, #qr-reader__dashboard { display: none !important; }

    .cam-msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
               justify-content: center; gap: 10px; padding: 28px; text-align: center; color: #cfdad8;
               font-size: 15px; line-height: 1.45; }
    .cam-msg .material-symbols-outlined { font-size: 40px; color: #7fd6cb; }

    .shade { position: absolute; inset: 0; background: rgba(0,0,0,.45); pointer-events: none;
             clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 0,
                                15% 15%, 15% 85%, 85% 85%, 85% 15%, 15% 15%); }
    .corner { position: absolute; width: 38px; height: 38px; border: 0 solid #2dd4bf; pointer-events: none; }
    .corner.tl { top: 15%; left: 15%; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 12px; }
    .corner.tr { top: 15%; right: 15%; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 12px; }
    .corner.bl { bottom: 15%; left: 15%; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 12px; }
    .corner.br { bottom: 15%; right: 15%; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 12px; }
    .line { position: absolute; left: 15%; right: 15%; height: 2px; background: rgba(45,212,191,.8);
            box-shadow: 0 0 12px rgba(45,212,191,.8); pointer-events: none; animation: scan 3s ease-in-out infinite; }
    @keyframes scan { 0%,100% { top: 15%; } 50% { top: 85%; } }
    @media (prefers-reduced-motion: reduce) { .line { animation: none; top: 50%; } }

    .tools { position: absolute; bottom: 3%; left: 0; right: 0; display: flex; justify-content: center; gap: 14px; }
    .tool { display: none; width: 42px; height: 42px; border-radius: 50%; border: 0; cursor: pointer;
            background: rgba(255,255,255,.22); color: #fff; align-items: center; justify-content: center; }
    .tool.show { display: flex; }
    .tool.on { background: #2dd4bf; color: #0b2f2a; }

    /* Status line + manual entry */
    #status { min-height: 22px; text-align: center; font-size: 14px; margin: 14px 0 0; color: #5b6665; }
    #status.err { color: #b3261e; }
    .manual { display: flex; gap: 8px; margin-top: 10px; }
    .manual input { flex: 1; min-width: 0; height: 56px; padding: 0 16px; font-size: 16px; font-family: inherit;
                    border: 2px solid #c3cccb; border-radius: 16px; background: #fff; outline: 0; }
    .manual input:focus { border-color: #0d9488; }
    .manual button { height: 56px; padding: 0 20px; border: 0; border-radius: 16px; background: #0d9488;
                     color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
    .manual button:disabled { opacity: .6; }
    .help { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 18px;
            height: 56px; border: 1px solid #c3cccb; border-radius: 16px; background: #fff; font-size: 15px;
            font-weight: 600; color: #1b1f23; cursor: pointer; }
    .help .material-symbols-outlined { color: #0d9488; }
    .help:hover { background: rgba(0,0,0,.04); }
    button:focus-visible { outline: 3px solid #0b5a52; outline-offset: 2px; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-gutter w-full h-16 sticky top-0 z-50 bg-surface border-b border-outline-variant">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-primary-container transition-colors active:opacity-80" onclick="window.location.href='employee-home.html'" aria-label="Back to home">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-black tracking-tight">Staff Portal</h1>
</div>
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center border-2 border-primary">
<span class="material-symbols-outlined text-on-primary-container">person</span>
</div>
</div>
</header>

<main class="page">
  <div class="intro">
    <h2>Ready to scan</h2>
    <p>Hold the customer's QR code inside the frame to open their order.</p>
  </div>

  <div class="finder">
    <div id="qr-reader"></div>
    <div class="cam-msg" id="cam-msg">
      <span class="material-symbols-outlined">videocam</span>
      <span id="cam-msg-text">Starting camera...</span>
    </div>
    <div class="shade"></div>
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="line"></div>
    <div class="tools">
      <button class="tool" id="torch-btn" type="button" aria-label="Torch"><span class="material-symbols-outlined">flashlight_on</span></button>
      <button class="tool" id="zoom-btn" type="button" aria-label="Zoom"><span class="material-symbols-outlined">zoom_in</span></button>
    </div>
  </div>

  <p id="status" role="status"></p>

  <div class="manual">
    <input id="manual-token-input" type="text" placeholder="Or type the token number" autocomplete="off" aria-label="Token number"/>
    <button id="fetch-order-btn" type="button">Fetch</button>
  </div>

  <button class="help" type="button" onclick="window.location.href='support.html'">
    <span class="material-symbols-outlined">support_agent</span> Get help
  </button>
</main>

<!-- Bottom Navigation Shell -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 bg-surface-container shadow-[0px_-4px_20px_rgba(0,0,0,0.05)] rounded-t-xl" style="padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-colors" href="employee-home.html">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-label-sm text-label-sm">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary text-on-primary rounded-xl px-6 py-1 active:scale-90 transition-transform duration-200" href="employee-dashboard.html">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">barcode_scanner</span>
<span class="font-label-sm text-label-sm">Scan</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-colors" href="support.html">
<span class="material-symbols-outlined">support_agent</span>
<span class="font-label-sm text-label-sm">Support</span>
</a>
</nav>

<script>
    // ---------------------------------------------------------
    // Require an employee session
    // ---------------------------------------------------------
    auth.onAuthStateChanged(user => {
        if (!user || localStorage.getItem('skpq_role') !== 'employee') {
            window.location.href = 'employee-login.html';
        }
    });

    const statusEl = document.getElementById('status');
    function setStatus(text, isErr) {
        statusEl.textContent = text || '';
        statusEl.className = isErr ? 'err' : '';
    }

    // ---------------------------------------------------------
    // Fetch a customer's session by token and go verify it
    // ---------------------------------------------------------
    let busy = false;
    async function fetchOrder(token) {
        token = (token || '').trim();
        if (!token || busy) return;
        busy = true;
        const btn = document.getElementById('fetch-order-btn');
        btn.disabled = true;
        setStatus('Looking up order...');
        try {
            const doc = await db.collection('sessions').doc(token).get();
            if (!doc.exists) {
                setStatus('No order found for token ' + token + '. Check the number and try again.', true);
                setTimeout(() => { busy = false; }, 1500);   // let the scanner try again
                return;
            }
            window.location.href = 'order-verification.html?token=' + encodeURIComponent(token);
        } catch (err) {
            setStatus('Could not load the order (' + (err.code || err.message) + ').', true);
            setTimeout(() => { busy = false; }, 1500);
        } finally {
            btn.disabled = false;
        }
    }

    document.getElementById('fetch-order-btn').addEventListener('click', () => {
        fetchOrder(document.getElementById('manual-token-input').value);
    });
    document.getElementById('manual-token-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') fetchOrder(e.target.value);
    });

    // ---------------------------------------------------------
    // QR scanning (html5-qrcode)
    // ---------------------------------------------------------
    const camMsg = document.getElementById('cam-msg');
    const camMsgText = document.getElementById('cam-msg-text');
    function camProblem(text) { camMsg.style.display = 'flex'; camMsgText.textContent = text; }

    function setupCameraControls() {
        const video = document.querySelector('#qr-reader video');
        if (!video || !video.srcObject) return;
        const track = video.srcObject.getVideoTracks()[0];
        if (!track || !track.getCapabilities) return;
        const caps = track.getCapabilities();

        if (caps.torch) {
            const torchBtn = document.getElementById('torch-btn');
            let on = false;
            torchBtn.classList.add('show');
            torchBtn.addEventListener('click', async () => {
                on = !on;
                try {
                    await track.applyConstraints({ advanced: [{ torch: on }] });
                    torchBtn.classList.toggle('on', on);
                } catch (e) { on = !on; }
            });
        }
        if (caps.zoom) {
            const zoomBtn = document.getElementById('zoom-btn');
            const min = caps.zoom.min, max = caps.zoom.max;
            const levels = [min, min + (max - min) / 2, max];
            let i = 0;
            zoomBtn.classList.add('show');
            zoomBtn.addEventListener('click', async () => {
                i = (i + 1) % levels.length;
                try {
                    await track.applyConstraints({ advanced: [{ zoom: levels[i] }] });
                    zoomBtn.classList.toggle('on', i > 0);
                } catch (e) {}
            });
        }
    }

    if (typeof Html5Qrcode === 'undefined') {
        camProblem('Camera scanner could not load. Type the token number below.');
    } else {
        const qr = new Html5Qrcode('qr-reader');
        qr.start(
            { facingMode: 'environment' },
            {
                fps: 10,
                // scan area matches the on-screen frame (70% of the viewfinder)
                qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.7); return { width: s, height: s }; }
            },
            decodedText => { fetchOrder(decodedText); },
            () => { /* ignore per-frame scan misses */ }
        ).then(() => {
            camMsg.style.display = 'none';
            setupCameraControls();
        }).catch(err => {
            console.warn('Camera unavailable:', err);
            const text = String(err && (err.name || err.message || err));
            if (/NotAllowed|Permission/i.test(text)) {
                camProblem('Camera is blocked. Tap the lock icon next to the address, allow Camera, then reload. You can also type the token below.');
            } else if (/NotFound|Devices/i.test(text)) {
                camProblem('No camera found. Type the token number below.');
            } else {
                camProblem('Camera could not start. Type the token number below.');
            }
        });
    }
</script>
</body></html>
