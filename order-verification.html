<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D9488">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SkpQ">
<script src="js/pwa.js" defer></script>
<link rel="stylesheet" href="css/tailwind.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
        }
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 16px;
        }
        @media (max-width: 768px) {
            .bento-grid { grid-template-columns: 1fr; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/cart.js"></script>
</head>
<body class="bg-background text-on-background min-h-screen pb-24">
<!-- Top Navigation -->
<header class="flex justify-between items-center px-gutter w-full h-16 sticky top-0 z-50 bg-surface border-b border-outline-variant">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-primary hover:bg-primary-container/10 p-2 rounded-full transition-colors" onclick="window.location.href='employee-dashboard.html'">arrow_back</button>
<h1 class="font-title-md text-title-md text-primary font-black tracking-tight">SkpQ</h1>
</div>
<div class="flex items-center gap-3">
<span class="text-label-sm font-label-sm text-on-surface-variant bg-surface-container px-3 py-1 rounded-full">Station #42</span>
<div class="w-10 h-10 rounded-full bg-primary-fixed-dim flex items-center justify-center text-on-primary-fixed font-bold">JD</div>
</div>
</header>
<main class="max-w-[1440px] mx-auto p-gutter space-y-6">
<!-- Order Header Info -->
<section class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-surface-container-low p-6 rounded-xl border border-outline-variant">
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Verification Required</p>
<h2 class="font-headline-lg text-headline-lg text-primary" id="order-token-label">Order #------</h2>
</div>
<div class="flex items-center gap-6">
<div class="text-right">
<p class="font-label-sm text-label-sm text-on-surface-variant">Customer</p>
<p class="font-body-md text-body-md font-bold" id="customer-name">--</p>
</div>
<div class="h-10 w-px bg-outline-variant"></div>
<div class="text-right">
<p class="font-label-sm text-label-sm text-on-surface-variant">Total Items</p>
<p class="font-body-md text-body-md font-bold text-primary" id="expected-total">--</p>
</div>
<div class="h-10 w-px bg-outline-variant"></div>
<div class="text-right">
<p class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1 justify-end"><span class="material-symbols-outlined text-[16px]">scale</span> Expected Weight</p>
<p class="font-body-md text-body-md font-bold text-secondary" id="expected-weight">--</p>
</div>
</div>
</section>
<!-- Main Content Grid -->
<div class="bento-grid">
<!-- Items Checklist (Col Span 8) -->
<div class="col-span-12 md:col-span-8 space-y-4">
<div class="bg-surface-container-lowest p-6 rounded-[24px] shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border border-outline-variant">
<h3 class="font-title-md text-title-md text-on-surface mb-6 flex items-center gap-2">
<span class="material-symbols-outlined">checklist</span>
                        Item Inventory
                    </h3>
<div class="space-y-3" id="items-checklist"></div>
</div>
</div>
</div>
<!-- Verification Controls (Col Span 4) -->
<div class="col-span-12 md:col-span-4 space-y-4">
<div class="bg-surface-container p-8 rounded-[24px] border-2 border-primary shadow-lg sticky top-24">
<h3 class="font-title-md text-title-md text-primary mb-6">Scale Verification</h3>
<div class="space-y-6">
<!-- Weight Input -->
<div>
<label class="font-label-md text-label-md text-on-surface-variant mb-2 block">Actual Weight Verified (kg)</label>
<div class="flex items-center gap-2">
<button class="w-12 h-14 bg-white border border-outline-variant rounded-xl flex items-center justify-center active:scale-95 transition-transform" onclick="decrementWeight()">
<span class="material-symbols-outlined">remove</span>
</button>
<input class="flex-1 h-14 bg-white border border-outline-variant rounded-xl text-center text-headline-lg font-bold text-on-surface focus:ring-2 focus:ring-primary focus:border-transparent outline-none" id="weightInput" step="0.1" type="number" value="0.0"/>
<button class="w-12 h-14 bg-white border border-outline-variant rounded-xl flex items-center justify-center active:scale-95 transition-transform" onclick="incrementWeight()">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
<!-- Status Chip -->
<div class="p-4 rounded-xl bg-surface-container-high border border-outline-variant flex items-center gap-3 transition-colors" id="weightStatus">
<div class="w-3 h-3 rounded-full bg-tertiary" id="statusDot"></div>
<span class="font-label-md text-label-md text-on-surface-variant" id="statusText">Awaiting input...</span>
</div>
<div class="pt-4 space-y-3">
<!-- Verified Button -->
<button class="w-full h-14 bg-secondary text-on-secondary rounded-xl font-title-md flex items-center justify-center gap-2 hover:opacity-90 active:scale-95 transition-all shadow-md" id="verify-btn">
<span class="material-symbols-outlined">check_circle</span>
                                Verified
                            </button>
<!-- Reject Button -->
<button class="w-full h-14 border-2 border-error text-error rounded-xl font-label-md flex items-center justify-center gap-2 hover:bg-error/5 active:scale-95 transition-all" id="reject-btn">
<span class="material-symbols-outlined">close</span>
                                Reject Order
                            </button>
</div>
</div>
<div class="mt-8 pt-6 border-t border-outline-variant">
<p class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">info</span>
                            Tolerance allowed: ± 0.15kg
                        </p>
</div>
</div>
</div>
</div>
</main>
<!-- Bottom Nav (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-surface-container rounded-t-xl shadow-[0px_-4px_20px_rgba(0,0,0,0.05)]">
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1">
<span class="material-symbols-outlined">home</span>
<span class="text-label-sm font-label-sm">Home</span>
</div>
<div class="flex flex-col items-center justify-center bg-primary text-on-primary rounded-xl px-4 py-1">
<span class="material-symbols-outlined">barcode_scanner</span>
<span class="text-label-sm font-label-sm">Scan</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1">
<span class="material-symbols-outlined">person</span>
<span class="text-label-sm font-label-sm">Profile</span>
</div>
</nav>
<script>
        // ---------------------------------------------------------
        // Require an employee session
        // ---------------------------------------------------------
        auth.onAuthStateChanged(user => {
            if (!user || localStorage.getItem('skpq_role') !== 'employee') {
                window.location.href = 'employee-login.html';
            }
        });

        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        let sessionData = null;
        let expectedWeightGrams = 0;

        if (!token) {
            alert('No order token specified.');
            window.location.href = 'employee-dashboard.html';
        }

        function formatWeight(grams) {
            if (!grams) return 'not set';
            return grams >= 1000 ? `${(grams / 1000).toFixed(2)} kg` : `${grams} g`;
        }

        async function loadOrder() {
            const doc = await db.collection('sessions').doc(token).get();
            if (!doc.exists) {
                alert('Order not found for token ' + token);
                window.location.href = 'employee-dashboard.html';
                return;
            }
            sessionData = doc.data();

            document.getElementById('order-token-label').textContent = `Order #${token}`;
            document.getElementById('customer-name').textContent = sessionData.customerName || 'Customer';
            const items = sessionData.items || [];
            const totalQty = items.reduce((s, i) => s + i.qty, 0);
            document.getElementById('expected-total').textContent = `${totalQty} item${totalQty === 1 ? '' : 's'} • ₹${(sessionData.total || 0).toFixed(2)}`;

            // Fall back to summing item weights for sessions created before
            // totalWeightGrams was added to the checkout doc.
            expectedWeightGrams = sessionData.totalWeightGrams
                ?? items.reduce((s, i) => s + (i.weightGrams || 0) * i.qty, 0);
            document.getElementById('expected-weight').textContent = formatWeight(expectedWeightGrams);

            document.getElementById('items-checklist').innerHTML = items.map(i => `
                <div class="flex items-center justify-between p-4 bg-surface-container-low rounded-xl border border-transparent">
                    <div>
                        <h4 class="font-body-md text-body-md font-bold">${i.name}</h4>
                        <p class="font-label-sm text-label-sm text-on-surface-variant">Qty: ${i.qty} • ${formatWeight(i.weightGrams)} each</p>
                    </div>
                    <p class="font-body-md text-body-md font-bold text-on-surface">₹${(i.price * i.qty).toFixed(2)}</p>
                </div>
            `).join('') || '<p class="text-on-surface-variant text-sm p-4">No items in this order.</p>';

            if (sessionData.status !== 'pending') {
                document.getElementById('statusText').textContent = `Session already marked: ${sessionData.status}`;
            }
        }
        loadOrder();

        // ---------------------------------------------------------
        // Weight input — compares the associate's scale reading
        // against the expected weight computed from the customer's
        // scanned items (with a small tolerance for packaging/scale
        // variance).
        // ---------------------------------------------------------
        const weightInput = document.getElementById('weightInput');
        const weightStatus = document.getElementById('weightStatus');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        function updateWeightDisplay() {
            const currentKg = parseFloat(weightInput.value);
            const expectedKg = expectedWeightGrams / 1000;

            if (!currentKg) {
                weightStatus.className = 'p-4 rounded-xl bg-surface-container-high border border-outline-variant flex items-center gap-3 transition-colors';
                statusDot.className = 'w-3 h-3 rounded-full bg-tertiary';
                statusText.innerText = expectedWeightGrams
                    ? `Awaiting scale reading (expecting ~${expectedKg.toFixed(2)} kg)...`
                    : 'Awaiting scale reading...';
                return;
            }

            if (!expectedWeightGrams) {
                // No expected weight on file for this order (e.g. an item
                // with no weight set in the catalog) — just log the reading.
                weightStatus.className = 'p-4 rounded-xl bg-secondary-container border border-secondary flex items-center gap-3 transition-colors';
                statusDot.className = 'w-3 h-3 rounded-full bg-secondary';
                statusText.innerText = `Weight logged: ${currentKg.toFixed(2)} kg (no expected weight on file to compare)`;
                return;
            }

            // Allow a small tolerance for packaging variance / scale precision
            const diffGrams = Math.abs(currentKg * 1000 - expectedWeightGrams);
            const toleranceGrams = Math.max(30, expectedWeightGrams * 0.05); // 5%, min 30g

            if (diffGrams <= toleranceGrams) {
                weightStatus.className = 'p-4 rounded-xl bg-secondary-container border border-secondary flex items-center gap-3 transition-colors';
                statusDot.className = 'w-3 h-3 rounded-full bg-secondary';
                statusText.innerText = `Weight matched: ${currentKg.toFixed(2)} kg (expected ${expectedKg.toFixed(2)} kg)`;
            } else {
                weightStatus.className = 'p-4 rounded-xl bg-error-container border border-error flex items-center gap-3 transition-colors';
                statusDot.className = 'w-3 h-3 rounded-full bg-error';
                statusText.innerText = `Weight mismatch: ${currentKg.toFixed(2)} kg vs expected ${expectedKg.toFixed(2)} kg — recheck items`;
            }
        }

        function incrementWeight() {
            weightInput.value = (parseFloat(weightInput.value) + 0.1).toFixed(1);
            updateWeightDisplay();
        }

        function decrementWeight() {
            const val = (parseFloat(weightInput.value) - 0.1).toFixed(1);
            weightInput.value = val < 0 ? 0 : val;
            updateWeightDisplay();
        }

        weightInput.addEventListener('input', updateWeightDisplay);

        // ---------------------------------------------------------
        // Verify / Reject — writes back to Firestore.
        // The customer's token.html page is listening for this
        // change and will redirect them to payment automatically.
        // ---------------------------------------------------------
        document.getElementById('verify-btn').addEventListener('click', async () => {
            await db.collection('sessions').doc(token).update({
                status: 'verified',
                verifiedWeightKg: parseFloat(weightInput.value) || null,
                verifiedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert('Order verified — customer has been sent to payment.');
            window.location.href = 'employee-dashboard.html';
        });

        document.getElementById('reject-btn').addEventListener('click', async () => {
            if (!confirm('Reject this order? The customer will be asked to see an associate.')) return;
            await db.collection('sessions').doc(token).update({ status: 'rejected' });
            window.location.href = 'employee-dashboard.html';
        });
    </script>
</body></html>
