<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkpQ Staff - Login</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --teal: #0d9488;
    --teal-dark: #006b5f;
    --ink: #1c2b2a;
    --muted: #6b7a79;
    --line: #b9c4c3;
    --bg: #eef3f6;
    --err: #b3261e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #e6edf2 0%, #f5f8fb 100%);
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center;
    padding: 0 20px env(safe-area-inset-bottom, 0);
    min-height: 100vh;
  }
  .badge {
    width: 84px; height: 84px; background: var(--teal-dark);
    border-radius: 0 0 22px 22px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(0,107,95,.25);
  }
  .badge svg { width: 38px; height: 38px; }
  h1 { color: var(--teal-dark); font-size: 32px; margin: 36px 0 6px; text-align: center; }
  .sub { color: var(--ink); font-size: 16px; margin: 0 0 32px; text-align: center; }
  .card {
    width: 100%; max-width: 420px; background: #fff; border: 1px solid #d5dcdf;
    border-radius: 32px; padding: 28px 22px 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,.06);
  }
  label { display: block; font-weight: 600; font-size: 16px; margin: 0 0 10px 4px; color: #2b3a39; }
  .field {
    display: flex; align-items: center; gap: 10px;
    border: 1.5px solid var(--line); border-radius: 24px; padding: 0 16px; height: 64px;
    background: #fff;
  }
  .field:focus-within { border-color: var(--teal); box-shadow: 0 0 0 4px rgba(13,148,136,.15); }
  .field svg { width: 24px; height: 24px; flex: none; }
  #pin {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    font-size: 26px; letter-spacing: 10px; color: var(--ink); text-align: center;
    font-family: inherit;
  }
  #pin::placeholder { letter-spacing: 0; font-size: 17px; color: #9aa7a6; }
  .eye { border: 0; background: none; padding: 6px; cursor: pointer; display: flex; }
  .hint { font-size: 14px; color: var(--muted); margin: 12px 4px 0; }
  .msg { min-height: 22px; font-size: 14px; margin: 12px 4px 0; color: var(--err); }
  button.go {
    width: 100%; height: 64px; margin-top: 10px; border: 0; border-radius: 24px;
    background: var(--teal); color: #fff; font-size: 19px; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 14px rgba(13,148,136,.3);
  }
  button.go:disabled { opacity: .6; cursor: default; }
  button:focus-visible { outline: 3px solid #0b5a52; outline-offset: 2px; }
  .foot { color: var(--muted); font-size: 14px; text-align: center; max-width: 340px; margin: 32px 0 24px; line-height: 1.5; }
</style>
</head>
<body>

<div class="badge" aria-hidden="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><circle cx="12" cy="10" r="2.2"/><path d="M8.5 16c.8-1.6 2-2.4 3.5-2.4s2.7.8 3.5 2.4"/></svg>
</div>

<h1>SkpQ Staff</h1>
<p class="sub">Inventory &amp; Logistics Management Portal</p>

<div class="card">
  <label for="pin">Enter PIN</label>
  <div class="field">
    <svg viewBox="0 0 24 24" fill="none" stroke="#1c2b2a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6"
           autocomplete="off" placeholder="6-digit PIN" aria-describedby="msg">
    <button class="eye" id="eye" type="button" aria-label="Show PIN">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#1c2b2a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
  <div class="msg" id="msg" role="alert"></div>
  <button class="go" id="go" type="button">Login</button>
</div>

<p class="foot">Authorized personnel only. All activities are logged under internal security protocols.</p>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
  // Hidden staff account. Created in Firebase Console > Authentication > Users.
  const STAFF_EMAIL = "staff@skpq.app";
  const NEXT_PAGE = "employee-home.html";

  const pin = document.getElementById("pin");
  const go = document.getElementById("go");
  const msg = document.getElementById("msg");
  const eye = document.getElementById("eye");

  // Keep digits only (also handles paste)
  pin.addEventListener("input", () => {
    pin.value = pin.value.replace(/\D/g, "").slice(0, 6);
    msg.textContent = "";
    if (pin.value.length === 6) login();
  });

  eye.addEventListener("click", () => {
    const show = pin.type === "password";
    pin.type = show ? "text" : "password";
    eye.setAttribute("aria-label", show ? "Hide PIN" : "Show PIN");
  });

  go.addEventListener("click", login);
  pin.addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });

  let busy = false;
  async function login() {
    if (busy) return;
    if (pin.value.length !== 6) { msg.textContent = "Enter your 6-digit PIN."; return; }
    busy = true; go.disabled = true; go.textContent = "Checking...";
    try {
      await auth.signInWithEmailAndPassword(STAFF_EMAIL, pin.value);
      location.href = NEXT_PAGE;
    } catch (err) {
      const wrong = ["auth/invalid-credential", "auth/wrong-password", "auth/user-not-found", "auth/invalid-login-credentials"];
      msg.textContent = wrong.includes(err.code)
        ? "Wrong PIN. Try again."
        : "Could not log in (" + (err.code || err.message) + ").";
      pin.value = ""; pin.focus();
    } finally {
      busy = false; go.disabled = false; go.textContent = "Login";
    }
  }
  pin.focus();
</script>
</body>
</html>
