<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D9488">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SkpQ">
<script src="js/pwa.js" defer></script>
<link rel="stylesheet" href="css/tailwind.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<title>SkpQ Staff Portal - Home</title>
<style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; display: inline-block; line-height: 1; }
    body { font-family: 'Inter', sans-serif; }

    /* Today's summary */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat { border-radius: 14px; padding: 14px 6px; text-align: center; }
    .stat b { display: block; font-size: 28px; line-height: 1.1; }
    .stat span { font-size: 13px; font-weight: 500; }
    .stat.ok   { background: #e3f4ef; color: #0b6b5e; }
    .stat.bad  { background: #fbe9e7; color: #a8281c; }
    .stat.wait { background: #fff3d6; color: #8a5a00; }

    /* Recent scans list */
    #recent-box { display: none; margin-top: 14px; }
    #recent-box.open { display: block; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px;
           width: 100%; text-align: left; background: #fff; border: 1px solid rgba(0,0,0,.1);
           border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
    .row:hover { background: rgba(0,0,0,.04); }
    .row .tok { font-weight: 700; font-size: 15px; }
    .row .time { font-size: 12px; color: rgba(0,0,0,.5); }
    .pill { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
    .pill.ok { background: #e3f4ef; color: #0b6b5e; }
    .pill.bad { background: #fbe9e7; color: #a8281c; }
    .pill.wait { background: #fff3d6; color: #8a5a00; }
    .note { font-size: 14px; color: rgba(0,0,0,.5); text-align: center; padding: 8px 0; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
</head>
<body class="bg-[#F4F6F8] text-[#1B1F23] min-h-screen flex flex-col">
<header class="flex items-center justify-between px-6 h-16 border-b border-black/10 bg-white">
<h1 class="font-bold text-lg text-[#0D9488]">SkpQ Staff Portal</h1>
<button class="p-2 rounded-full hover:bg-black/5" id="logout-btn" title="Sign out">
<span class="material-symbols-outlined">logout</span>
</button>
</header>
<main class="flex-1 max-w-lg mx-auto w-full px-6 py-10 flex flex-col gap-8">
<section class="text-center">
<div class="w-16 h-16 mx-auto rounded-full bg-[#0D9488]/10 flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-[#0D9488] text-3xl">badge</span>
</div>
<p class="text-black/50 text-sm">Signed in as</p>
<h2 class="text-xl font-bold" id="employee-email">--</h2>
</section>

<button class="w-full bg-[#0D9488] hover:bg-[#0b7a6f] text-white font-bold py-5 rounded-2xl shadow-lg flex items-center justify-center gap-3 active:scale-95 transition-all" onclick="window.location.href='employee-dashboard.html'">
<span class="material-symbols-outlined">qr_code_scanner</span>
Start Scanning / Verify Order
</button>

<section class="bg-white rounded-2xl border border-black/10 p-5">
<h3 class="font-semibold mb-3">Today's orders</h3>
<div class="stats">
  <div class="stat ok"><b id="n-ok">-</b><span>Verified</span></div>
  <div class="stat bad"><b id="n-bad">-</b><span>Rejected</span></div>
  <div class="stat wait"><b id="n-wait">-</b><span>Waiting</span></div>
</div>
</section>

<section class="bg-white rounded-2xl border border-black/10 p-5">
<h3 class="font-semibold mb-3">Quick links</h3>
<div class="grid grid-cols-2 gap-3">
<button class="flex flex-col items-center gap-2 p-4 rounded-xl border border-black/10 hover:bg-black/5 transition-colors" onclick="window.location.href='support.html'">
<span class="material-symbols-outlined text-[#0D9488]">support_agent</span>
<span class="text-sm font-medium">Support</span>
</button>
<button class="flex flex-col items-center gap-2 p-4 rounded-xl border border-black/10 hover:bg-black/5 transition-colors" id="recent-btn">
<span class="material-symbols-outlined text-[#0D9488]">history</span>
<span class="text-sm font-medium">Recent Scans</span>
</button>
</div>
<div id="recent-box"><div class="note">Loading...</div></div>
</section>
</main>
<script>
    auth.onAuthStateChanged(user => {
        if (!user || localStorage.getItem('skpq_role') !== 'employee') {
            window.location.href = 'index.html';
            return;
        }
        document.getElementById('employee-email').textContent = user.email || 'Staff member';
        loadToday();
    });

    async function doLogout() {
        await auth.signOut();
        localStorage.removeItem('skpq_role');
        window.location.href = 'index.html';
    }
    document.getElementById('logout-btn').addEventListener('click', doLogout);

    // ---------------------------------------------------------
    // Today's summary + recent scans
    // ---------------------------------------------------------
    function bucket(status) {
        const s = String(status || '').toLowerCase();
        if (['verified', 'paid', 'completed', 'done'].includes(s)) return 'ok';
        if (s === 'rejected' || s === 'reject') return 'bad';
        return 'wait';
    }
    const LABEL = { ok: 'Verified', bad: 'Rejected', wait: 'Waiting' };

    function toDate(v) {
        if (!v) return null;
        if (typeof v.toDate === 'function') return v.toDate();
        const d = new Date(v);
        return isNaN(d) ? null : d;
    }

    async function loadToday() {
        const box = document.getElementById('recent-box');
        try {
            const start = new Date();
            start.setHours(0, 0, 0, 0);
            const snap = await db.collection('sessions')
                .where('createdAt', '>=', start)
                .orderBy('createdAt', 'desc')
                .limit(100)
                .get();

            const count = { ok: 0, bad: 0, wait: 0 };
            const rows = [];
            snap.forEach(doc => {
                const d = doc.data();
                const b = bucket(d.status);
                count[b]++;
                rows.push({ token: doc.id, b, when: toDate(d.createdAt) });
            });

            document.getElementById('n-ok').textContent = count.ok;
            document.getElementById('n-bad').textContent = count.bad;
            document.getElementById('n-wait').textContent = count.wait;

            if (!rows.length) {
                box.innerHTML = '<div class="note">No orders yet today.</div>';
                return;
            }
            box.innerHTML = '';
            rows.slice(0, 5).forEach(r => {
                const btn = document.createElement('button');
                btn.className = 'row';
                const time = r.when
                    ? r.when.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' })
                    : '';
                btn.innerHTML =
                    '<div><div class="tok"></div><div class="time"></div></div>' +
                    '<span class="pill ' + r.b + '">' + LABEL[r.b] + '</span>';
                btn.querySelector('.tok').textContent = 'Token ' + r.token;
                btn.querySelector('.time').textContent = time;
                btn.addEventListener('click', () => {
                    window.location.href = 'order-verification.html?token=' + encodeURIComponent(r.token);
                });
                box.appendChild(btn);
            });
        } catch (err) {
            console.warn('Could not load today\'s orders:', err);
            ['n-ok', 'n-bad', 'n-wait'].forEach(id => document.getElementById(id).textContent = '-');
            box.innerHTML = '<div class="note">Could not load orders (' + (err.code || err.message) + ').</div>';
        }
    }

    document.getElementById('recent-btn').addEventListener('click', () => {
        document.getElementById('recent-box').classList.toggle('open');
    });
</script>
</body></html>
