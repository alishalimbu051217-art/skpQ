<body class="bg-background text-on-background min-h-screen font-body-md flex flex-col transition-colors duration-300">
<!-- TopAppBar -->

<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-primary-fixed font-black">SkpQ</h1>
</div>
</header>
<main class="flex-grow container mx-auto px-container-padding max-w-lg py-xl">
<!-- Profile Header Section -->
<section class="flex flex-col items-center text-center mb-xl">
<div class="relative group cursor-pointer" id="avatar-click-target">
<div class="w-28 h-28 rounded-full border-4 border-primary p-1 mb-4 shadow-lg overflow-hidden bg-primary-container flex items-center justify-center">
<img class="w-full h-full rounded-full object-cover hidden" id="avatar-img" alt="Your profile picture"/>
<span class="material-symbols-outlined text-on-primary-container" style="font-size: 56px;" id="avatar-fallback">person</span>
</div>
<div class="absolute bottom-6 right-2 bg-primary text-on-primary p-1.5 rounded-full shadow-md scale-90">
<span class="material-symbols-outlined !text-[18px]">edit</span>
</div>
<input type="file" accept="image/*" class="hidden" id="avatar-file-input"/>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-1" id="profile-name">Loading...</h2>
<p class="font-body-md text-on-surface-variant" id="profile-email"></p>
</section>
<!-- Profile Settings Bento Grid -->
<div class="grid grid-cols-1 gap-md mb-xl">
<!-- Appearance Toggle -->
<div class="bg-surface-container-low dark:bg-inverse-surface p-md rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)] flex items-center justify-between border border-outline-variant/30">
<div class="flex items-center gap-md">
<div class="w-10 h-10 flex items-center justify-center rounded-lg bg-primary/10 text-primary">
<span class="material-symbols-outlined">dark_mode</span>
</div>
<div>
<p class="font-label-md text-on-surface">Dark Mode</p>

</div>
</div>
<button class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none bg-outline-variant" id="theme-toggle" onclick="toggleDarkMode()">
<span class="sr-only">Toggle Dark Mode</span>
<span aria-hidden="true" class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out translate-x-0" id="toggle-thumb"></span>
</button>
</div>
<!-- Order History -->
<div class="bg-surface-container-low dark:bg-inverse-surface p-md rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border border-outline-variant/30">
<div class="flex items-center justify-between mb-md">

</div>
<div class="space-y-sm" id="order-history-list">
<p class="text-center text-on-surface-variant text-sm py-4">Loading...</p>
</div>
</div>
<!-- Additional Options -->
<div class="bg-surface-container-low dark:bg-inverse-surface p-md rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border border-outline-variant/30">
<div class="space-y-md">
<div class="flex items-center gap-md cursor-pointer hover:bg-surface-variant/50 p-2 rounded-lg transition-all" onclick="window.location.href='edit-profile.html'">

<span class="material-symbols-outlined">edit</span>
</div>

<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
</div>
</div>
</div>
<!-- Logout Action -->

<span class="material-symbols-outlined">logout</span>
            Logout
        </button>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe shadow-[0px_-4px_20px_rgba(0,0,0,0.05)] bg-surface-container dark:bg-inverse-surface rounded-t-xl">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary-fixed transition-colors" onclick="window.location.href='dashboard.html'">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary-fixed transition-colors" onclick="window.location.href='scan.html'">
<span class="material-symbols-outlined">barcode_scanner</span>
<span class="font-label-sm text-label-sm">Scan</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary text-on-primary rounded-xl px-4 py-1 Active: scale-90 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</button>
</nav>
<script>
        function toggleDarkMode() {
            const html = document.documentElement;
            const thumb = document.getElementById('toggle-thumb');
            const toggle = document.getElementById('theme-toggle');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                thumb.classList.replace('translate-x-5', 'translate-x-0');
                toggle.classList.replace('bg-primary', 'bg-outline-variant');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                thumb.classList.replace('translate-x-0', 'translate-x-5');
                toggle.classList.replace('bg-outline-variant', 'bg-primary');
                localStorage.setItem('theme', 'dark');
            }
        }

        // Sync the toggle's visual state with the current theme on load
        window.addEventListener('DOMContentLoaded', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.getElementById('toggle-thumb').classList.replace('translate-x-0', 'translate-x-5');
                document.getElementById('theme-toggle').classList.replace('bg-outline-variant', 'bg-primary');
            }
        });

        // Add subtle interaction effects for list items
        document.querySelectorAll('.group').forEach(item => {
            item.addEventListener('mousedown', () => {
                item.style.transform = 'scale(0.98)';
            });
            item.addEventListener('mouseup', () => {
                item.style.transform = 'scale(1)';
            });
            item.addEventListener('mouseleave', () => {
                item.style.transform = 'scale(1)';
            });
        });
    </script>
<script>
    let currentUid = null;

    auth.onAuthStateChanged(user => {
        if (!user) { window.location.href = 'login.html'; return; }
        currentUid = user.uid;
        document.getElementById('profile-name').textContent = user.displayName || 'SkpQ Customer';
        document.getElementById('profile-email').textContent = user.email || '';
        loadProfileDoc(user);
        loadOrderHistory(user.uid);
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
        await auth.signOut();
        Cart.clear();
        window.location.href = 'index.html';
    });

    // ---------------------------------------------------------
    // Avatar (stored as a small base64 image on the user's Firestore doc)
    // ---------------------------------------------------------
    function setAvatarDisplay(photoURL) {
        const img = document.getElementById('avatar-img');
        const fallback = document.getElementById('avatar-fallback');
                if (photoURL) {
            img.src = photoURL;
            img.classList.remove('hidden');
            img.style.display = 'block';
            fallback.style.display = 'none';
        } else {
            img.style.display = 'none';
            fallback.style.display = 'inline-block';
        }
    }

    async function loadProfileDoc(user) {
        try {
            const doc = await db.collection('users').doc(user.uid).get();
            const data = doc.exists ? doc.data() : {};
                        setAvatarDisplay(data.photo || data.photoURL || null);
        } catch (err) {
            console.error('Could not load profile doc:', err);
            setAvatarDisplay(null);
        }
    }

    document.getElementById('avatar-click-target').addEventListener('click', () => {
        document.getElementById('avatar-file-input').click();
    });

    document.getElementById('avatar-file-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file || !currentUid) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
            const image = new Image();
            image.onload = async () => {
                // Downscale to keep the doc small (Firestore doc limit is 1MB)
                const size = 200;
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                const scale = Math.max(size / image.width, size / image.height);
                const w = image.width * scale, h = image.height * scale;
                ctx.drawImage(image, (size - w) / 2, (size - h) / 2, w, h);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.85);

                setAvatarDisplay(dataUrl);
                try {
                    await db.collection('users').doc(currentUid).set({ photo: dataUrl }, { merge: true });                } catch (err) {
                    console.error(err);
                    alert('Could not save your profile picture: ' + err.message);
                }
            };
            image.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    });

    // ---------------------------------------------------------
    // Order history — real completed sessions from Firestore
    // ---------------------------------------------------------
    async function loadOrderHistory(uid) {
        const listEl = document.getElementById('order-history-list');
        try {
            const snap = await db.collection('sessions')
                .where('customerUid', '==', uid)
                .where('status', '==', 'paid')
                .orderBy('createdAt', 'desc')
                .limit(10)
                .get();

            if (snap.empty) {
                listEl.innerHTML = '<p class="text-center text-on-surface-variant text-sm py-4">No past orders yet.</p>';
                return;
            }

            listEl.innerHTML = snap.docs.map(doc => {
                const d = doc.data();
                const date = d.createdAt ? d.createdAt.toDate().toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '--';
                                const itemCount = (d.items || []).reduce((s, i) => s + i.qty, 0);
                const itemsHtml = (d.items || []).map(i => `
                    <div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px;">
                        <span>${i.name || i.code || 'Item'} × ${i.qty}</span>
                        <span>₹${((i.price || 0) * i.qty).toFixed(2)}</span>
                    </div>`).join('');
                return `
                    <details style="padding:10px 8px;">
                        <summary style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none;">
                            <div>
                                <p class="font-label-md text-on-surface">${date}</p>
                                <p class="text-xs text-on-surface-variant">${itemCount} item${itemCount === 1 ? '' : 's'} · tap to view</p>
                            </div>
                            <span class="font-title-md text-primary">₹${(d.total || 0).toFixed(2)}</span>
                        </summary>
                        <div style="margin-top:8px;border-top:1px solid rgba(0,0,0,0.08);padding-top:6px;">${itemsHtml || '<p class="text-xs">No item details saved.</p>'}</div>
                    </details>
                `;
            }).join('<div class="h-px bg-outline-variant/20 mx-2"></div>');
        } catch (err) {
            console.error('Could not load order history:', err);
            listEl.innerHTML = '<p class="text-center text-on-surface-variant text-sm py-4">Could not load order history.</p>';
        }
    }
</script>
</body></html>
