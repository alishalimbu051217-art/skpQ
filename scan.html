<!-- Expanded cart panel (hidden until the pill is tapped) -->

<div class="px-gutter pt-md pb-sm flex justify-between items-center cursor-pointer" onclick="toggleDrawer()">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">shopping_cart</span>
<span class="font-title-md text-on-surface" id="cart-count-full">0 items in cart</span>
</div>
<div class="text-right">
<p class="text-label-sm text-on-surface-variant">Subtotal</p>
<p class="font-headline-lg-mobile text-primary" id="cart-subtotal">₹0.00</p>
</div>
</div>
<div class="px-gutter overflow-y-auto pb-32">
<div class="space-y-4 pt-md" id="drawer-items">
<p class="text-center text-on-surface-variant text-sm py-4">No items scanned yet.</p>
</div>
</div>
<div class="p-gutter glass-panel border-t border-outline-variant space-y-sm">
<button class="w-full bg-primary text-on-primary py-4 rounded-2xl font-headline-lg-mobile shadow-lg shadow-primary/20 hover:opacity-95 active:scale-95 transition-all flex items-center justify-center gap-2" onclick="window.location.href='cart.html'">
<span>Finalize Bill</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<button class="w-full bg-transparent text-primary py-3 rounded-2xl font-label-md border-2 border-primary/30 hover:bg-primary/5 active:scale-95 transition-all flex items-center justify-center gap-2" onclick="toggleDrawer()">
<span class="material-symbols-outlined">barcode_scanner</span>
<span>Continue Scanning</span>
</button>

<!-- Bottom Nav Bar (Suppressed on focused scan task as per mandate but present as shell reference) -->
<!-- Not rendered to prioritize the scan canvas and focused journey -->
<script>
        function toggleDrawer() {
            document.getElementById('cart-drawer').classList.toggle('hidden');
            document.getElementById('cart-drawer').classList.toggle('flex');
        }

        // Micro-interaction: Gentle shake of the scan line occasionally
        setInterval(() => {
            const line = document.querySelector('.scan-line');
            if (line) line.style.opacity = (0.5 + Math.random() * 0.5).toString();
        }, 500);

        // ---------------------------------------------------------
        // Draggable floating cart pill — tap to open the cart,
        // drag to move it out of the way of the camera view.
        // ---------------------------------------------------------
        (function makePillDraggable() {
            const pill = document.getElementById('cart-pill');
            const btn = document.getElementById('cart-pill-btn');
            let dragging = false, moved = false, startX, startY, startRight, startBottom;

            btn.addEventListener('pointerdown', (e) => {
                dragging = true;
                moved = false;
                startX = e.clientX;
                startY = e.clientY;
                const rect = pill.getBoundingClientRect();
                startRight = window.innerWidth - rect.right;
                startBottom = window.innerHeight - rect.bottom;
                btn.setPointerCapture(e.pointerId);
            });
            btn.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
                pill.style.right = Math.max(8, startRight - dx) + 'px';
                pill.style.bottom = Math.max(8, startBottom - dy) + 'px';
            });
            btn.addEventListener('pointerup', () => {
                dragging = false;
                if (!moved) toggleDrawer(); // it was a tap, not a drag
            });
        })();
    </script>
<script>
    // ---------------------------------------------------------
    // Require login
    // ---------------------------------------------------------
    auth.onAuthStateChanged(user => {
        if (!user) window.location.href = 'login.html';
    });

    document.querySelector('header button').addEventListener('click', () => {
        window.location.href = 'dashboard.html';
    });

    // ---------------------------------------------------------
    // Product catalog — checks Firestore first (your real catalog,
    // uploaded via import-products.html), falls back to this small
    // local list so the demo still works offline / before you've
    // uploaded anything.
    // ---------------------------------------------------------
    const LOCAL_FALLBACK_DB = {
        "0123456789012": { name: "Whole Milk, 1L", category: "Organic Milk", price: 65.00, weightGrams: 1030 },
        "0234567890123": { name: "Red Apples (6pk)", category: "Produce", price: 120.00, weightGrams: 900 },
        "0345678901234": { name: "Artisan Sourdough", category: "Bakery", price: 90.00, weightGrams: 400 }
    };
    const productCache = {};

    function formatWeight(grams) {
        if (!grams) return 'weight not set';
        return grams >= 1000 ? `${(grams / 1000).toFixed(2)} kg` : `${grams} g`;
    }

    async function lookupProduct(code) {
        if (productCache[code]) return productCache[code];
        try {
            const doc = await db.collection('products').doc(code).get();
            if (doc.exists) {
                productCache[code] = doc.data();
                return doc.data();
            }
        } catch (err) {
            console.warn('Firestore product lookup failed, using local fallback:', err);
        }
        return LOCAL_FALLBACK_DB[code] || { name: `Item ${code}`, category: "Unrecognized item", price: 0, weightGrams: 0 };
    }

    function renderCart() {
        const items = Cart.get();
        const totalQty = items.reduce((s, i) => s + i.qty, 0);

        document.getElementById('cart-count').textContent = `${totalQty} item${totalQty === 1 ? '' : 's'}`;
        document.getElementById('cart-count-full').textContent = `${totalQty} item${totalQty === 1 ? '' : 's'} in cart`;
        document.getElementById('cart-subtotal').textContent = `₹${Cart.total().toFixed(2)}`;

        const listEl = document.getElementById('drawer-items');
        if (items.length === 0) {
            listEl.innerHTML = '<p class="text-center text-on-surface-variant text-sm py-4">No items scanned yet.</p>';
            return;
        }
        listEl.innerHTML = items.map(i => `
            <div class="flex items-center gap-md p-md bg-surface-container-lowest rounded-2xl border border-outline-variant/30">
                <div class="flex-1">
                    <p class="font-label-md text-on-surface">${i.name}</p>
                    <p class="text-xs text-on-surface-variant">Qty: ${i.qty} • ${formatWeight(i.weightGrams)} each</p>
                </div>
                <span class="font-bold text-on-surface">₹${(i.price * i.qty).toFixed(2)}</span>
                <button class="w-9 h-9 flex items-center justify-center rounded-full text-error hover:bg-error/10 transition-colors" onclick="removeScannedItem('${i.code}')" aria-label="Remove ${i.name}">
                    <span class="material-symbols-outlined text-[20px]">delete</span>
                </button>
            </div>
        `).join('');
    }

    function removeScannedItem(code) {
        Cart.removeItem(code);
        renderCart();
        if (window.navigator.vibrate) window.navigator.vibrate(10);
    }

    // ---------------------------------------------------------
    // Brief on-screen confirmation toast (auto-dismisses).
    // Scanned items are added to the cart immediately — no extra
    // tap needed — this toast is just a "got it" confirmation.
    // ---------------------------------------------------------
    let toastTimer = null;
    function showScanToast(product) {
        const popup = document.getElementById('confirmation-popup');
        document.getElementById('popup-category').textContent = product.category;
        document.getElementById('popup-name').textContent = product.name;
        document.getElementById('popup-price').textContent = `₹${product.price.toFixed(2)} • ${formatWeight(product.weightGrams)} • added to cart`;
        popup.classList.remove('hidden');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => popup.classList.add('hidden'), 1800);
    }

    // ---------------------------------------------------------
    // Quagga2 barcode scanning
    // ---------------------------------------------------------
    let scanLocked = false; // global cooldown — prevents one physical
                             // barcode from being added as multiple items
                             // once it's been successfully read

    // Quagga fires onDetected on EVERY camera frame, and any single frame
    // can misread a barcode (blur, glare, bad angle) — especially the
    // first frame or two before the camera settles. Instead of trusting
    // the very first read, we require the SAME code to come up several
    // times in a short window before accepting it as real. This is what
    // was causing "unrecognized item" / wrong weight on early attempts.
    const CONSENSUS_COUNT = 3;      // reads needed before accepting a code
    const CONSENSUS_WINDOW_MS = 800; // how recent those reads must be
    let recentReads = []; // { code, time }

    function startScanner() {
        if (typeof Quagga === 'undefined') {
            console.warn('Quagga2 not loaded — check your internet connection / CDN.');
            return;
        }
        Quagga.init({
            inputStream: {
                type: "LiveStream",
                target: document.querySelector('#scanner-viewport'),
                constraints: { facingMode: "environment" }
            },
            decoder: {
                readers: ["ean_reader", "ean_8_reader", "upc_reader", "upc_e_reader", "code_128_reader"]
            },
            locate: true
        }, err => {
            if (err) {
                console.error('Quagga init failed:', err);
                return; // Falls back to the static background image
            }
            document.getElementById('camera-fallback').style.display = 'none';
            Quagga.start();
        });

        Quagga.onDetected(async result => {
            if (scanLocked) return;

            const code = result.codeResult.code;
            const now = Date.now();

            // Drop stale reads, then log this one
            recentReads = recentReads.filter(r => now - r.time < CONSENSUS_WINDOW_MS);
            recentReads.push({ code, time: now });

            // Not enough agreement yet — wait for more frames
            const matches = recentReads.filter(r => r.code === code).length;
            if (matches < CONSENSUS_COUNT) return;

            // We have consensus — this read is trustworthy. Lock and commit.
            scanLocked = true;
            recentReads = [];

            const product = await lookupProduct(code);
            Cart.addItem({ code, name: product.name, price: product.price, weightGrams: product.weightGrams || 0, qty: 1 });
            renderCart();
            showScanToast(product);
            if (window.navigator.vibrate) window.navigator.vibrate(30);

            // Require a fresh, deliberate hold-up-the-item moment before
            // the next scan is accepted — this is what stops one barcode
            // from flooding in as 5-9 items.
            setTimeout(() => { scanLocked = false; }, 2000);
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        renderCart();
        startScanner();
    });
</script>
